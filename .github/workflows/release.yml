name: Release Geode Mod

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Geode Mod"]
    types:
      - completed

jobs:
  release:
    name: Release mod
    runs-on: ubuntu-latest
    # Only release when the build succeeded on master (or when run manually)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}

    steps:
      - uses: actions/checkout@v4

      - uses: hiimjasmine00/release-geode-mod@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          replace: true
          branch: master
          draft: false
